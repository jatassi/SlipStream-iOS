# SlipStream iOS — SwiftLint configuration
#
# Division of labor (see CLAUDE.md → Linting):
#   swift-format → ALL formatting: whitespace, wrapping, indentation, braces, import order.
#   SwiftLint    → semantic / correctness lint ONLY.
# Every cosmetic rule that swift-format owns is disabled below so the two tools never fight.
# The codebase is held at ZERO violations (the pre-commit hook runs `--strict`); prefer fixing
# code over adding inline `// swiftlint:disable` — disables need extremely strong justification.

# Build artifacts, generated sources, dependencies, and tooling state SwiftLint must never read.
# `.claude` is excluded so SwiftLint never recurses into sibling git worktrees under
# `.claude/worktrees/*` (each holds a full source checkout that would otherwise be linted).
excluded:
  - .claude
  - "**/.build"
  - .swiftpm
  - DerivedData
  - build

# ----------------------------------------------------------------------------------------
# Cosmetic rules OWNED BY swift-format — disabled so SwiftLint stays purely semantic.
# ----------------------------------------------------------------------------------------
disabled_rules:
  # whitespace / blank lines
  - trailing_whitespace
  - leading_whitespace
  - vertical_whitespace
  - return_arrow_whitespace
  - function_name_whitespace
  - attribute_name_spacing
  - no_space_in_method_call
  # punctuation / delimiters
  - colon
  - comma
  - trailing_comma
  - trailing_semicolon
  - statement_position
  # braces / parens / alignment
  - opening_brace
  - closing_brace
  - closure_parameter_position
  - vertical_parameter_alignment
  - switch_case_alignment
  - empty_parentheses_with_trailing_closure
  - empty_parameters
  - control_statement              # swift-format owns this (NoParensAroundConditions)
  - computed_accessors_order
  - protocol_property_accessors_order
  # line length / file trailing newline — swift-format owns wrapping
  - line_length
  - trailing_newline
  # void-return spelling — swift-format owns this (ReturnVoidInsteadOfEmptyTuple)
  - redundant_void_return
  - void_return
  # comment cosmetics (not semantic)
  - mark

# ----------------------------------------------------------------------------------------
# Aggressive semantic / correctness rule set (noise machines deliberately excluded:
# explicit_*_acl, explicit_type_interface, explicit_enum_raw_value, *_order, attributes,
# number_separator, no_magic_numbers, missing_docs, object_literal, strict_fileprivate,
# trailing_closure, required_deinit, discouraged_optional_*, unused_parameter, and all
# style-kind/whitespace opt-ins — swift-format territory).
# ----------------------------------------------------------------------------------------
opt_in_rules:
  # correctness / safety
  - force_unwrapping
  - implicitly_unwrapped_optional
  - fatal_error_message
  - unowned_variable_capture
  - weak_delegate
  - yoda_condition
  - identical_operands
  - overridden_super_call
  - prohibited_super_call
  - override_in_extension
  - lower_acl_than_parent
  - unhandled_throwing_task
  - async_without_await
  # NOTE: `incompatible_concurrency_annotation` intentionally OMITTED — it pushes
  # `@preconcurrency` for Swift-5 source compatibility, which is wrong for this
  # Swift-6-only local package (it would only weaken concurrency checking).
  - discarded_notification_center_observer
  - untyped_error_in_catch
  - variable_shadowing
  - return_value_from_void_function
  - raw_value_for_camel_cased_codable_enum
  - local_doc_comment
  # SwiftUI
  - private_swiftui_state
  - accessibility_label_for_image
  - accessibility_trait_for_button
  # idiomatic
  - convenience_type
  - discouraged_none_name
  - function_default_parameter_at_end
  - joined_default_parameter
  - legacy_multiple
  - legacy_objc_type
  - pattern_matching_keywords
  - prefer_key_path
  - prefer_zero_over_explicit_init
  - redundant_nil_coalescing
  - redundant_type_annotation
  - redundant_final
  - shorthand_optional_binding
  - static_operator
  - toggle_bool
  - unavailable_function
  - unneeded_escaping
  - unneeded_throws_rethrows
  # performance
  - array_init
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - empty_collection_literal
  - empty_count
  - empty_string
  - first_where
  - last_where
  - flatmap_over_map_reduce
  - reduce_into
  - sorted_first_last
  # metrics
  - closure_body_length

# ----------------------------------------------------------------------------------------
# Rule configuration
# ----------------------------------------------------------------------------------------
# `todo` is kept ON (TODOs are flagged) and, under `--strict`, blocks commits — track work in
# docs/TRACKER.md, not in code comments.
identifier_name:
  min_length:
    warning: 2
  excluded: [id, db, vm, to, ok, x, y, i, j]

function_parameter_count:
  warning: 6
  error: 8
